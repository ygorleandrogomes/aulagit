<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>gov.com.br</title>
</head>
<body>
    <main class="container-main">
    <div class="container">
        <h1 style="text-align: center;"> Cadastro </h1>
        <form action="">
            <div class="campo">
                <label for="nome">Nome: </label>
                <input type="text" nome ="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="usuario">Usuário: </label>
                <input type="text" usuario ="usuario" placeholder="Digite seu usuário">
            </div>

            <div class="campo">
                <label for="idade">Idade: </label>
                <input type="number" idade ="idade" placeholder="Digite sua senha">
            </div>

            <div class="campo">
                <label for="email">Email: </label>
                <input type="email" email ="email" placeholder="Digite seu email">
            </div>

            <div class="campo">
                <label for="senha">Senha: </label>
                <input type="password" senha ="senha" placeholder="Digite sua senha">
            </div> 
            <div class="btn">
                <button type="submit">Cadastrar</button>
            </div>                 
        </form>

    </div>

    </main>
    
</body>
</html>
